[package]
name = "offline-language-practice"
version = "0.1.0"
description = "Offline-first language practice: on-device ASR, TTS, FSRS, grammar, SQLite"
edition = "2021"
rust-version = "1.77"
# Matches LICENSE at the repo root and `bundle.license` in tauri.conf.json.
# Without it `cargo deny check licenses` reports the crate as unlicensed.
license = "MIT"
repository = "https://github.com/lubdhak7414/offline-language-practice"

[lib]
name = "offline_language_practice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Subsystem 1: shell + IPC
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
http = "1"

# Subsystem 5: persistence (WAL + declarative migrations)
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
# Native open/save file pickers for export/import/backup/restore (B2).
tauri-plugin-dialog = "2"

# Subsystem 2: neural speech (ort v2.0-rc series, no default zoo bloat)
# NOTE: pinned to rc.12 to unify with piper-rs 0.2.0 (pins ort rc.12 + ndarray 0.16).
# orp (rc.9) intentionally NOT a dependency — incompatible ort pin; pipeline pattern
# is implemented manually in asr.rs/tts.rs.
# Execution-provider features are per-platform (see the target sections
# below): `ort-sys` fetches a different prebuilt ONNX Runtime for each, and
# asking a Linux build for CoreML or a macOS build for DirectML asks for a
# binary that does not exist. The Rust EP types are not feature-gated, so
# `inference.rs` needs no `cfg` — an EP that was not compiled in simply
# fails to register and ORT falls back to CPU, which is already the
# documented behaviour there.
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
  "download-binaries",
  "ndarray",
  "half",
] }
ndarray = "0.16"
piper-rs = "0.2.0"

# Subsystem 3: cognitive scheduler (FSRS-6, 21 params; Rayon via fsrs)
fsrs = "6.6.2"

# Subsystem 4: local grammar (offline, deterministic)
harper-core = "=0.62.0"

uuid = { version = "1", features = ["v4"] }
thiserror = "1"

# Subsystem 6: in-app model downloader (Phase 5).
# TLS: `default-tls` (native-tls) on purpose, not `rustls-tls`. reqwest's
# rustls feature pulls aws-lc-rs, whose build needs NASM on Windows
# x86_64 — a build dependency the release runners do not have and that
# would only ever fail on the one platform this repo cannot test locally.
# native-tls uses SChannel on Windows and Security.framework on macOS, and
# OpenSSL on Linux, which the Tauri Linux build already requires.
reqwest = { version = "0.12", default-features = false, features = [
  "default-tls",
  "http2",
] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
  "directml",
  "cuda",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
  "cuda",
  "openvino",
] }

[features]
default = []
# Strictly constrained edge distributions: build with --no-default-features style
# minimal onnx build handled via ort minimal-build docs (see README).

# Release tuning (safe subset only). NOTE: `panic = "abort"` is deliberately
# omitted: Tauri and several transitive deps unwind on panic, so abort would
# break the build/runtime.
[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
