[package]
name = "offline-language-practice"
version = "0.1.0"
description = "Offline-first language practice: on-device ASR, TTS, FSRS, grammar, SQLite"
edition = "2021"
rust-version = "1.77"

[lib]
name = "offline_language_practice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
# Subsystem 1: shell + IPC
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
http = "1"

# Subsystem 5: persistence (WAL + declarative migrations)
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

# Subsystem 2: neural speech (ort v2.0-rc series, no default zoo bloat)
# NOTE: pinned to rc.12 to unify with piper-rs 0.2.0 (pins ort rc.12 + ndarray 0.16).
# orp (rc.9) intentionally NOT a dependency — incompatible ort pin; pipeline pattern
# is implemented manually in asr.rs/tts.rs.
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
  "download-binaries",
  "ndarray",
  "half",
  "coreml",
  "cuda",
  "directml",
  "openvino",
] }
ndarray = "0.16"
piper-rs = "0.2.0"

# Subsystem 3: cognitive scheduler (FSRS-6, 21 params; Rayon via fsrs)
fsrs = "6.6.2"

# Subsystem 4: local grammar (offline, deterministic)
harper-core = "=0.62.0"

uuid = { version = "1", features = ["v4"] }
thiserror = "1"

[features]
default = []
# Strictly constrained edge distributions: build with --no-default-features style
# minimal onnx build handled via ort minimal-build docs (see README).

# Release tuning (safe subset only). NOTE: `panic = "abort"` is deliberately
# omitted: Tauri and several transitive deps unwind on panic, so abort would
# break the build/runtime.
[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
