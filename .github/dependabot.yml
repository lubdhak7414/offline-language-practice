version: 2

# Weekly, grouped, and deliberately conservative about the pins that are
# not ours to move:
#
#   * `ort` is pinned to =2.0.0-rc.12 to match piper-rs 0.2.0, which pins
#     the same rc. Bumping one without the other gives two incompatible
#     copies of the ONNX Runtime bindings in one binary.
#   * `harper-core` is pinned exactly because its lint rule set changes
#     between patch releases, which moves grammar output under the tests.
#   * `piper-rs` is the other half of the `ort` pin: a new piper-rs means a
#     new ort, so its PRs can only fail. Move both by hand, together.
#   * `sqlx` must be the major `tauri-plugin-sql` uses, because `db.rs`
#     clones the plugin's pool; a second major fails with E0277 on
#     `Executor`. The plugin is on ^0.8 through 2.5.0 and 3.0.0-alpha.1.
#   * `sha2` 0.11 would only add a second digest stack next to the 0.10
#     that sqlx-core and tauri-codegen still use.
#
# All are listed as ignored so Dependabot does not open a PR a human will
# only ever close. Drop an entry when its reason stops being true.
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: ort
      - dependency-name: harper-core
      - dependency-name: piper-rs
      - dependency-name: sqlx
        versions: [">= 0.9"]
      # Drop when `cargo tree -i sha2@0.10.9` lists only this crate.
      - dependency-name: sha2
        versions: [">= 0.11"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # vitest and @preact/preset-vite declare vite peer ranges, so a vite
      # major has to arrive with theirs, in one PR.
      vite-toolchain:
        patterns: ["vite", "vitest", "@vitest/*", "@preact/preset-vite"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
