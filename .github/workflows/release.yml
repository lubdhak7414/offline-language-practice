name: Release

# Tag-driven. `git tag v0.1.0 && git push origin v0.1.0` builds every
# platform and leaves a DRAFT release: nothing is published until a human
# opens it, checks the notes and presses the button.
on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed end to end without creating a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail in ten seconds rather than forty minutes if the tag and the three
  # version fields disagree. A release whose artifacts say 0.1.0 while the
  # tag says 0.2.0 is worse than no release.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG_VER=$(jq -r .version package.json)
          TAURI_VER=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tag=$TAG version=$VERSION package=$PKG_VER tauri=$TAURI_VER cargo=$CARGO_VER"
          for got in "$PKG_VER" "$TAURI_VER" "$CARGO_VER"; do
            if [ "$got" != "$VERSION" ]; then
              echo "::error::Tag $TAG implies version $VERSION, but a manifest says $got."
              exit 1
            fi
          done
          # Windows MSI (WiX) packs the version into 16-bit fields, so a
          # pre-release part must be a plain number <= 65535: 0.2.0-1, never
          # 0.2.0-rc.1. The rehearsal for 0.1.0 found this the slow way — the
          # Windows leg built for 15 minutes, then died at the MSI step with
          # "optional pre-release identifier ... must be numeric-only".
          case "$VERSION" in
            *-*)
              PRE="${VERSION#*-}"
              if ! [[ "$PRE" =~ ^[0-9]+$ ]] || [ "$PRE" -gt 65535 ]; then
                echo "::error::Pre-release '$PRE' cannot be packaged as an MSI. Use a number, e.g. ${VERSION%%-*}-1."
                exit 1
              fi
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Every release carries the updater, so an unsigned build would be one
      # that installed copies can never move off. Fail in seconds, not after
      # the ~40 minutes the build legs take to reach the signing step.
      - name: Require the updater signing key and a real public key
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set. See SECURITY.md, 'Automatic updates'."
            exit 1
          fi
          # A minisign public key file, base64-encoded, is ~150 characters.
          # The placeholder committed before the owner's key existed is not.
          if ! jq -e '.plugins.updater.pubkey | test("^[A-Za-z0-9+/=]{100,}$")' src-tauri/tauri.conf.json >/dev/null; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is missing or a placeholder."
            exit 1
          fi

  # One draft, created before any build starts, and every leg is handed its
  # id. Letting tauri-action create the release per leg is a race: GitHub's
  # get-release-by-tag API does not return drafts, so legs that start
  # together each create their own. The second rehearsal (run 35766827124)
  # ended with two drafts for v0.1.0-1 — Linux and Windows in one, macOS in
  # the other — and a green run that checksummed only one of them.
  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # A re-run reuses its draft instead of making another. Listing, not
          # the by-tag endpoint: that one returns 404 for a draft.
          id=$(gh api "repos/$REPO/releases" --paginate \
                 --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            # Code signing is deliberately not configured — see SECURITY.md.
            # Unsigned artifacts plus published checksums and build
            # provenance is an honest position; a self-signed certificate
            # pretending to be a trusted one is not.
            cat > notes.md <<'EOF'
          See CHANGELOG.md for what changed.

          These builds are **not code-signed**. macOS: open the app once,
          then System Settings -> Privacy & Security -> Open Anyway.
          Windows: SmartScreen shows "More info" -> "Run anyway"; with Smart
          App Control on, unsigned apps are blocked (see SECURITY.md).
          Verify what you downloaded against `SHA256SUMS`, which is
          attested to this workflow run:

              sha256sum -c SHA256SUMS --ignore-missing
              gh attestation verify <file> --repo ${{ github.repository }}

          Models are not bundled. The app downloads them on first run, or
          run `scripts/download-models.sh`.
          EOF
            # A numeric pre-release (0.2.0-1) is published as a GitHub
            # pre-release, which /releases/latest never resolves to, so no
            # installed copy is ever offered a rehearsal build.
            case "$VERSION" in *-*) PRE=true ;; *) PRE=false ;; esac
            id=$(gh api "repos/$REPO/releases" -X POST \
                   -f tag_name="$TAG" -f name="v$VERSION" \
                   -F draft=true -F prerelease="$PRE" -F body=@notes.md --jq .id)
          fi
          echo "draft release $id for $TAG"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, release]
    permissions:
      contents: write
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One platform failing should not throw away three good builds; the
      # release is a draft anyway, so a partial set can be completed by
      # re-running the failed job.
      fail-fast: false
      matrix:
        include:
          # 24.04 (glibc 2.39), never 22.04 (2.35). `ort`'s prebuilt ONNX
          # Runtime is compiled against glibc >= 2.38 and fails to link on
          # 22.04 with `undefined symbol: __isoc23_strtoll`. That sets the
          # oldest Linux this can be built on, and therefore the oldest it
          # can be installed on.
          - os: ubuntu-24.04
            label: linux-x86_64
            target_dir: /tmp/cargo-target
          - os: macos-15
            label: macos-aarch64
            target_dir: /tmp/cargo-target
          # No Intel macOS leg. `ort` publishes no prebuilt ONNX Runtime for
          # x86_64-apple-darwin — its build script stops with "ort does not
          # provide prebuilt binaries for the target" — so that leg could only
          # ever fail, and a permanently failing leg would turn every release
          # run red. Supporting Intel Macs means compiling ONNX Runtime from
          # source on that runner (see https://ort.pyke.io/setup/linking).
          # The retired `macos-13` label it used would not have been scheduled
          # anyway; the Intel runners are `macos-15-intel` / `macos-26-intel`.
          # espeak-ng's data compiler truncates paths through a fixed-size
          # buffer and the default workspace path is already long.
          - os: windows-latest
            label: windows-x86_64
            target_dir: C:\ct
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      # AppImage only. linuxdeploy ships its own (old) binutils, and that
      # `strip` cannot parse the `.relr.dyn` sections that modern toolchains
      # emit for packed relative relocations:
      #
      #   strip: libzstd.so.1: unknown type [0x13] section `.relr.dyn'
      #   failed to bundle project: `failed to run linuxdeploy`
      #
      # Reproduced locally against system libraries built that way; the deb
      # and rpm bundle fine and only the AppImage step dies. Skipping the
      # strip costs a few MB in an AppImage that is already ~116 MB and is
      # the documented workaround. Harmless on a runner that would not have
      # hit it.
      NO_STRIP: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
      # espeak needs cmake at build time; every hosted runner ships one.
      - run: cmake --version

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: release-${{ matrix.os }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles (.AppImage, .app.tar.gz, -setup.exe,
          # .msi, and .deb/.rpm, which are signed but never offered).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload to the one draft the `release` job made. No tagName:
          # everything is addressed by id (see the `release` job).
          releaseId: ${{ needs.release.outputs.id }}
          # Updater artifacts only here, so a contributor's `tauri build`
          # needs no signing key (tauri-cli refuses to bundle them without
          # one). Relative to the repo root, where the action runs the CLI.
          args: --config src-tauri/tauri.updater.conf.json
          # latest.json is written once, by `attest`, from the draft's own
          # assets. tauri-action's per-leg read-modify-write of latest.json
          # races across the three legs (one retry), points at api.github.com
          # asset URLs, and would advertise .deb/.rpm installs.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true

  # Checksums and provenance are the whole security story for an unsigned
  # release, so they are produced once, over every platform's output, rather
  # than per job where they could silently cover only part of the set.
  attest:
    needs: [check, release, build]
    # Not the default `success()`. With fail-fast off, tauri-action has already
    # uploaded every good platform's binaries to the draft by the time one leg
    # fails; skipping this job would leave them there with no checksums and no
    # provenance, under a release body telling people to verify against both.
    # So: run over whatever built, then fail the run (last step) so a partial
    # set is loud. `skipped` means the version check failed and nothing built.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # For scripts/updater-manifest.mjs only; nothing here is built.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Checksum and attest exactly what a user can download: the draft's
      # own assets, not files handed over by the build jobs. tauri-action
      # uploads things the build never reports — the rehearsal for 0.1.0
      # found the macOS `.app.tar.gz`, tarred at upload time, sitting in the
      # release with no checksum and no attestation, where
      # `sha256sum -c --ignore-missing` would silently skip it.
      #
      # By release id throughout. Tag lookup is ambiguous for drafts (and
      # returns 404 for them), which is how a green run once checksummed the
      # wrong half of a split release.
      - name: Download the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.release.outputs.id }}
        run: |
          mkdir -p dist
          gh api "repos/$REPO/releases/$ID/assets" --paginate \
              --jq '.[] | "\(.id)\t\(.name)"' |
            while IFS=$'\t' read -r asset name; do
              # A previous attempt's list and manifest are regenerated below,
              # and must not become subjects of their own attestation.
              case "$name" in SHA256SUMS|latest.json) continue ;; esac
              gh api -H "Accept: application/octet-stream" \
                "repos/$REPO/releases/assets/$asset" > "dist/$name"
            done

      # `subject-path` fails on a glob that matches nothing, with an error that
      # does not say why. Say why.
      - name: Require at least one bundle
        shell: bash
        run: |
          count=$(find dist -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "bundles to attest: $count"
          ls -l dist || true
          if [ "$count" -eq 0 ]; then
            echo "::error::No bundles were produced; nothing to checksum or attest."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # One writer, after every leg, from exactly what the draft holds. Written
      # before attestation so latest.json is a provenance subject and in
      # SHA256SUMS, like every .sig beside it. continue-on-error so a bundle
      # without a signature still leaves the draft checksummed and attested;
      # the last step fails the run on it.
      - name: Write latest.json for the updater
        id: manifest
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: node scripts/updater-manifest.mjs dist "$REPO" "$TAG" "$VERSION"

      # Before SHA256SUMS is written, so the subjects are exactly the
      # release binaries. Attesting the artifacts rather than only the
      # checksum file matters: provenance over a list of hashes proves
      # where the list came from, not where the binaries came from.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\n' \
            | sort \
            | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Attach SHA256SUMS and latest.json to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.release.outputs.id }}
        run: |
          for file in SHA256SUMS latest.json; do
            [ -f "dist/$file" ] || continue
            # Replace a previous attempt's file rather than failing on the name.
            for old in $(gh api "repos/$REPO/releases/$ID/assets" --paginate \
                           --jq ".[] | select(.name == \"$file\") | .id"); do
              gh api -X DELETE "repos/$REPO/releases/assets/$old"
            done
            case "$file" in *.json) ctype=application/json ;; *) ctype=text/plain ;; esac
            gh api -X POST -H "Content-Type: $ctype" \
              "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=$file" \
              --input "dist/$file" --jq '"uploaded \(.name), \(.size) bytes"'
          done

      # Every build succeeding is not the same as every platform being in the
      # draft: the split-release race was green. Name the files each platform
      # must contribute, so a missing one fails the run by name.
      - name: Require every platform in the draft
        if: ${{ needs.build.result == 'success' }}
        run: |
          missing=0
          for want in _amd64.deb _amd64.AppImage .x86_64.rpm \
                      _aarch64.dmg _aarch64.app.tar.gz \
                      _x64-setup.exe _x64_en-US.msi \
                      _amd64.AppImage.sig _aarch64.app.tar.gz.sig \
                      _x64-setup.exe.sig _x64_en-US.msi.sig latest.json; do
            if ! ls dist | grep -qF -- "$want"; then
              echo "::error::The draft has no *$want."
              missing=1
            fi
          done
          if [ -f dist/latest.json ]; then
            jq -e '.platforms | has("linux-x86_64") and has("darwin-aarch64") and has("windows-x86_64")
                   and has("windows-x86_64-msi") and (has("linux-x86_64-deb") | not)' dist/latest.json \
              || { echo "::error::latest.json does not cover every platform."; missing=1; }
          fi
          exit "$missing"

      # The draft now carries correct checksums and provenance for the
      # platforms that built — and only those. End red, so nobody publishes a
      # partial release believing a green tick covered all three.
      - name: Fail the run if the platform set is incomplete
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "::error::build result was '${{ needs.build.result }}'. SHA256SUMS and provenance cover only the platforms that built. Re-run the failed jobs (this one re-runs with them) before publishing."
          exit 1

      # The manifest step is allowed to fail so the steps above still run;
      # a draft whose updater manifest could not be written must not look
      # publishable.
      - name: Fail the run if latest.json could not be written
        if: ${{ steps.manifest.outcome == 'failure' }}
        run: |
          echo "::error::scripts/updater-manifest.mjs failed (see its step). The draft has no usable latest.json; do not publish it."
          exit 1
