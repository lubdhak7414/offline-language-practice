name: Release

# Tag-driven. `git tag v0.1.0 && git push origin v0.1.0` builds every
# platform and leaves a DRAFT release: nothing is published until a human
# opens it, checks the notes and presses the button.
on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed end to end without creating a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail in ten seconds rather than forty minutes if the tag and the three
  # version fields disagree. A release whose artifacts say 0.1.0 while the
  # tag says 0.2.0 is worse than no release.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG_VER=$(jq -r .version package.json)
          TAURI_VER=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tag=$TAG version=$VERSION package=$PKG_VER tauri=$TAURI_VER cargo=$CARGO_VER"
          for got in "$PKG_VER" "$TAURI_VER" "$CARGO_VER"; do
            if [ "$got" != "$VERSION" ]; then
              echo "::error::Tag $TAG implies version $VERSION, but a manifest says $got."
              exit 1
            fi
          done
          # Windows MSI (WiX) packs the version into 16-bit fields, so a
          # pre-release part must be a plain number <= 65535: 0.2.0-1, never
          # 0.2.0-rc.1. The rehearsal for 0.1.0 found this the slow way — the
          # Windows leg built for 15 minutes, then died at the MSI step with
          # "optional pre-release identifier ... must be numeric-only".
          case "$VERSION" in
            *-*)
              PRE="${VERSION#*-}"
              if ! [[ "$PRE" =~ ^[0-9]+$ ]] || [ "$PRE" -gt 65535 ]; then
                echo "::error::Pre-release '$PRE' cannot be packaged as an MSI. Use a number, e.g. ${VERSION%%-*}-1."
                exit 1
              fi
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    permissions:
      contents: write
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One platform failing should not throw away three good builds; the
      # release is a draft anyway, so a partial set can be completed by
      # re-running the failed job.
      fail-fast: false
      matrix:
        include:
          # 24.04 (glibc 2.39), never 22.04 (2.35). `ort`'s prebuilt ONNX
          # Runtime is compiled against glibc >= 2.38 and fails to link on
          # 22.04 with `undefined symbol: __isoc23_strtoll`. That sets the
          # oldest Linux this can be built on, and therefore the oldest it
          # can be installed on.
          - os: ubuntu-24.04
            label: linux-x86_64
            target_dir: /tmp/cargo-target
          - os: macos-14
            label: macos-aarch64
            target_dir: /tmp/cargo-target
          # No Intel macOS leg. `ort` publishes no prebuilt ONNX Runtime for
          # x86_64-apple-darwin — its build script stops with "ort does not
          # provide prebuilt binaries for the target" — so that leg could only
          # ever fail, and a permanently failing leg would turn every release
          # run red. Supporting Intel Macs means compiling ONNX Runtime from
          # source on that runner (see https://ort.pyke.io/setup/linking).
          # The retired `macos-13` label it used would not have been scheduled
          # anyway; the Intel runners are `macos-15-intel` / `macos-26-intel`.
          # espeak-ng's data compiler truncates paths through a fixed-size
          # buffer and the default workspace path is already long.
          - os: windows-latest
            label: windows-x86_64
            target_dir: C:\ct
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      # AppImage only. linuxdeploy ships its own (old) binutils, and that
      # `strip` cannot parse the `.relr.dyn` sections that modern toolchains
      # emit for packed relative relocations:
      #
      #   strip: libzstd.so.1: unknown type [0x13] section `.relr.dyn'
      #   failed to bundle project: `failed to run linuxdeploy`
      #
      # Reproduced locally against system libraries built that way; the deb
      # and rpm bundle fine and only the AppImage step dies. Skipping the
      # strip costs a few MB in an AppImage that is already ~116 MB and is
      # the documented workaround. Harmless on a runner that would not have
      # hit it.
      NO_STRIP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
      # espeak needs cmake at build time; every hosted runner ships one.
      - run: cmake --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: release-${{ matrix.os }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "v__VERSION__"
          releaseDraft: true
          prerelease: false
          # The updater stays off until 1.0 (no signing key, no endpoint), and
          # v1 of this action uploads a latest.json by default. Say no rather
          # than rely on it quietly doing nothing without signatures.
          uploadUpdaterJson: false
          # Code signing is deliberately not configured — see SECURITY.md.
          # Unsigned artifacts plus published checksums and build
          # provenance is an honest position; a self-signed certificate
          # pretending to be a trusted one is not.
          releaseBody: |
            See CHANGELOG.md for what changed.

            These builds are **not code-signed**. Verify what you downloaded
            against `SHA256SUMS`, which is attested to this workflow run:

                sha256sum -c SHA256SUMS --ignore-missing
                gh attestation verify <file> --repo ${{ github.repository }}

            Models are not bundled. The app downloads them on first run, or
            run `scripts/download-models.sh`.

  # Checksums and provenance are the whole security story for an unsigned
  # release, so they are produced once, over every platform's output, rather
  # than per job where they could silently cover only part of the set.
  attest:
    needs: build
    # Not the default `success()`. With fail-fast off, tauri-action has already
    # uploaded every good platform's binaries to the draft by the time one leg
    # fails; skipping this job would leave them there with no checksums and no
    # provenance, under a release body telling people to verify against both.
    # So: run over whatever built, then fail the run (last step) so a partial
    # set is loud. `skipped` means the version check failed and nothing built.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Checksum and attest exactly what a user can download: the draft's
      # own assets, not files handed over by the build jobs. tauri-action
      # uploads things the build never reports — the rehearsal for 0.1.0
      # found the macOS `.app.tar.gz`, tarred at upload time, sitting in the
      # release with no checksum and no attestation, where
      # `sha256sum -c --ignore-missing` would silently skip it.
      - name: Download the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          # A previous attempt's list; it is regenerated below, and it must
          # not become a subject of its own attestation.
          rm -f dist/SHA256SUMS

      # `subject-path` fails on a glob that matches nothing, with an error that
      # does not say why. Say why.
      - name: Require at least one bundle
        shell: bash
        run: |
          count=$(find dist -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "bundles to attest: $count"
          ls -l dist || true
          if [ "$count" -eq 0 ]; then
            echo "::error::No bundles were produced; nothing to checksum or attest."
            exit 1
          fi

      # Before SHA256SUMS is written, so the subjects are exactly the
      # release binaries. Attesting the artifacts rather than only the
      # checksum file matters: provenance over a list of hashes proves
      # where the list came from, not where the binaries came from.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\n' \
            | sort \
            | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: dist/SHA256SUMS

      # The draft now carries correct checksums and provenance for the
      # platforms that built — and only those. End red, so nobody publishes a
      # partial release believing a green tick covered all four.
      - name: Fail the run if the platform set is incomplete
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "::error::build result was '${{ needs.build.result }}'. SHA256SUMS and provenance cover only the platforms that built. Re-run the failed jobs (this one re-runs with them) before publishing."
          exit 1
