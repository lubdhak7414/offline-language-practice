name: CI

on:
  # Branch-scoped so a PR branch doesn't run this twice (push + pull_request).
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (via vitest) needs ^22.22.2 || ^24.15.0 || >=26; on
          # Node 20 its bundled undici throws
          # "webidl.util.markAsUncloneable is not a function" before any
          # test runs. Keep this in step with `engines` in package.json.
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm test` is tsc --noEmit + vitest run.
      - run: npm test
      - run: npx vite build
      # Non-blocking: surface known prod-dependency vulnerabilities without failing CI.
      - run: npm audit --omit=dev
        continue-on-error: true

  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Version triple check (package.json, tauri.conf.json, Cargo.toml)
        run: |
          PKG_VER=$(jq -r .version package.json)
          TAURI_VER=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "package.json: $PKG_VER"
          echo "tauri.conf.json: $TAURI_VER"
          echo "Cargo.toml: $CARGO_VER"
          if [ "$PKG_VER" != "$TAURI_VER" ] || [ "$PKG_VER" != "$CARGO_VER" ]; then
            echo "::error::Version mismatch: package.json ($PKG_VER) vs tauri.conf.json ($TAURI_VER) vs Cargo.toml ($CARGO_VER). Keep all three in sync."
            exit 1
          fi

  icon-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Icon presence check (.icns/.ico)
        run: |
          MISSING=0
          if ! ls src-tauri/icons/*.icns >/dev/null 2>&1; then
            echo "missing: src-tauri/icons/*.icns"
            MISSING=1
          fi
          if ! ls src-tauri/icons/*.ico >/dev/null 2>&1; then
            echo "missing: src-tauri/icons/*.ico"
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Missing release icon set: src-tauri/icons/*.icns and/or *.ico not found. Regenerate with: npx tauri icon <1024px-master>.png -o src-tauri/icons"
            exit 1
          fi

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # espeak-ng's vendored data compiler truncates paths through a small
      # fixed-size buffer; GitHub's default workspace path (which repeats
      # the repo name) is long enough to overflow it. Keep the build dir short.
      CARGO_TARGET_DIR: /tmp/cargo-target
    steps:
      - uses: actions/checkout@v4
      # espeak (pulled in by the TTS backend) needs cmake at build time.
      # ubuntu-latest runners ship cmake; this is a sanity check only (no apt install).
      - run: cmake --version
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      # --all-targets so integration tests under src-tauri/tests/ actually run;
      # --lib silently skipped them.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets

  # Cross-platform compile gate. The Linux `rust` job above is the one that
  # runs fmt/clippy/tests; this one only answers "does it still build
  # somewhere else", which is the question a Linux-only CI cannot answer and
  # which the per-platform `ort` execution-provider features make real.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: it is the oldest glibc a release is
          # expected to run on, and it is the build host that decides that.
          - os: ubuntu-22.04
            cargo_target_dir: /tmp/cargo-target
          - os: macos-14
            cargo_target_dir: /tmp/cargo-target
          # espeak-ng's data compiler truncates paths through a fixed-size
          # buffer, and the runner's default workspace path is already long.
          - os: windows-latest
            cargo_target_dir: C:\ct
    env:
      CARGO_TARGET_DIR: ${{ matrix.cargo_target_dir }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
      # espeak needs cmake; every hosted runner ships one, so this only
      # fails loudly if that ever stops being true.
      - run: cmake --version
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: ${{ matrix.os }}
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked
